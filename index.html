<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج إرسال طلب – فالنسيا لتجاره الرخام والحجر الطبيعي ش ذم م</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #f2f6fc 0%, #e9ecf0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: 0.3s;
        }
        .container {
            max-width: 550px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 35px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: 0.3s;
        }
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo h1 {
            font-size: 26px;
            color: #1e2a3a;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .logo h1 span {
            color: #c8902d;
        }
        .logo p {
            color: #7a8a9e;
            font-size: 15px;
            margin-top: 6px;
            border-top: 2px solid #f0f2f5;
            padding-top: 10px;
        }
        /* Language Switcher */
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lang-btn {
            padding: 6px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 40px;
            background: transparent;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            color: #1e2a3a;
        }
        .lang-btn:hover {
            border-color: #c8902d;
            background: #fcf9f2;
        }
        .lang-btn.active {
            border-color: #c8902d;
            background: #c8902d;
            color: #fff;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #1e2a3a;
            margin-bottom: 5px;
        }
        .form-group label .required {
            color: #e74c3c;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            transition: 0.25s;
            background: #fafcff;
            color: #1e2a3a;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #c8902d;
            box-shadow: 0 0 0 4px rgba(200, 144, 45, 0.1);
            background: #ffffff;
        }
        .form-group textarea {
            min-height: 110px;
            resize: vertical;
        }
        .form-group .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fafcff;
            border: 1.5px dashed #cbd5e1;
            border-radius: 14px;
            padding: 10px 16px;
            transition: 0.3s;
            cursor: pointer;
        }
        .form-group .file-input-wrapper:hover {
            border-color: #c8902d;
            background: #fcf9f2;
        }
        .form-group .file-input-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            right: 0;
            opacity: 0;
            cursor: pointer;
        }
        .form-group .file-input-wrapper .file-label {
            color: #64748b;
            font-size: 14px;
            pointer-events: none;
        }
        .form-group .file-input-wrapper .file-icon {
            color: #c8902d;
            font-size: 20px;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #c8902d, #b07c1f);
            color: #fff;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(200, 144, 45, 0.3);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .alert {
            padding: 14px 18px;
            border-radius: 14px;
            margin-bottom: 22px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        .alert-error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fca5a5;
        }
        .alert-warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fcd34d;
        }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
            padding-top: 18px;
        }
        .footer i {
            color: #c8902d;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .container { padding: 20px; }
            .logo h1 { font-size: 22px; }
            .lang-btn { padding: 4px 12px; font-size: 12px; }

</head>

        </div>

        <div class="form-group">
            <label for="department" data-i18n="deptLabel">🏢 القسم</label>
            <select id="department" name="department">
                <option value="" data-i18n="deptDefault">-- اختر القسم --</option>
                <option value="المبيعات" data-i18n="deptSales">المبيعات</option>
                <option value="المستودعات" data-i18n="deptWarehouse">المستودعات</option>
                <option value="المشاريع" data-i18n="deptProjects">المشاريع</option>
                <option value="الرخام" data-i18n="deptMarble">الرخام</option>
                <option value="المحاسبة" data-i18n="deptFinance">المحاسبة</option>
                <option value="الآليات" data-i18n="deptVehicles">الآليات</option>
                <option value="التصميم" data-i18n="deptDesign">التصميم</option>
                <option value="التسويق" data-i18n="deptMarketing">التسويق</option>
                <option value="أخرى" data-i18n="deptOther">أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="request_type" data-i18n="typeLabel">📌 نوع الطلب</label>
            <select id="request_type" name="request_type">
                <option value="" data-i18n="typeDefault">-- اختر نوع الطلب --</option>
                <option value="إجازة" data-i18n="typeLeave">إجازة</option>
                <option value="سلفة مالية" data-i18n="typeLoan">سلفة مالية</option>
                <option value="استفسار" data-i18n="typeInquiry">استفسار</option>
                <option value="شكوى" data-i18n="typeComplaint">شكوى</option>
                <option value="مقترح" data-i18n="typeSuggestion">مقترح</option>
                <option value="تحديث بيانات" data-i18n="typeDataUpdate">تحديث بيانات</option>
                <option value="طلب مستند" data-i18n="typeDocRequest">طلب مستند</option>
                <option value="أخرى" data-i18n="typeOther">أخرى</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subject" data-i18n="subjectLabel">📝 الموضوع <span class="required">*</span></label>
            <input type="text" id="subject" name="subject" required placeholder="عنوان مختصر للطلب" data-i18n-placeholder="subjectPlaceholder">
        </div>

        <div class="form-group">
            <label for="details" data-i18n="detailsLabel">📄 التفاصيل <span class="required">*</span></label>
            <textarea id="details" name="details" required placeholder="اكتب طلبك بالتفصيل..." data-i18n-placeholder="detailsPlaceholder"></textarea>
        </div>

        <div class="form-group">
            <label for="attachment" data-i18n="fileLabel">📎 إرفاق ملف (اختياري)</label>
            <div class="file-input-wrapper">
                <span class="file-icon"><i class="fas fa-cloud-upload-alt"></i></span>
                <span class="file-label" id="fileLabel" data-i18n="fileDefault">اختر ملف... (صور، PDF، Word)</span>
                <input type="file" id="attachment" name="attachment" accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx">
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn" data-i18n="submitBtn">
            <i class="fas fa-paper-plane"></i> إرسال الطلب
        </button>
    </form>

    <div class="footer" data-i18n="footerText">
        <i class="fas fa-lock"></i> يتم إرسال طلبك بشكل آمن ومباشر إلى الإدارة عبر تليجرام
    </div>
</div>

        function setLanguage(lang) {

                document.body.style.textAlign = 'right';

                        const textWithoutSpan = t[key].replace(' *', '').replace('*', '');
                        el.childNodes.forEach(node => {
                            if (node.nodeType === Node.TEXT_NODE) {
                                node.textContent = textWithoutSpan + ' ';
                            }
                        });
                        if (span) {
                            // نضيف النجمة إذا لم تكن موجودة
                            if (!t[key].includes('*')) {
                                span.remove();
                            }
                        } else if (t[key].includes('*')) {
                            const newSpan = document.createElement('span');
                            newSpan.className = 'required';
                            newSpan.textContent = '*';
                            el.appendChild(newSpan);
                        }
                    } else {
                        el.textContent = t[key];
                    }
                }
            });

            // تحديث الـ placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key] !== undefined) {
                    el.placeholder = t[key];
                }
            });

            // تحديث خيارات الـ select (data-i18n)
            document.querySelectorAll('select option[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    el.textContent = t[key];
                }
            });

            // تحديث زر التبديل النشط
            langBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });

            // تحديث اسم الملف إذا كان موجوداً
            if (fileInput.files.length > 0) {
                const fileName = fileInput.files[0].name;
                const size = (fileInput.files[0].size / 1024).toFixed(1);
                fileLabel.textContent = fileName + ' (' + size + ' KB)';
            } else {
                fileLabel.textContent = t.fileDefault;
            }
        }

        // ============================================================
        //  دوال الإشعارات
        // ============================================================
        function showAlert(messageKey, type = 'success') {
            const t = TRANSLATIONS[currentLang];
            const message = t[messageKey] || messageKey;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-info-circle'
            };
            alertContainer.innerHTML = `
                <div class="alert alert-${type}">
                    <i class="fas ${icons[type] || 'fa-info-circle'}"></i>
                    ${message}
                </div>
            `;
            setTimeout(() => { alertContainer.innerHTML = ''; }, 8000);
        }

        // ============================================================
        //  دوال التليجرام
        // ============================================================
        async function sendTelegramMessage(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const params = new URLSearchParams({
                chat_id: CHAT_ID,
                text: text,
                parse_mode: 'HTML',
                disable_web_page_preview: true
            });
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            return response.ok;
        }

        async function sendTelegramFile(file, caption) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`;
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('document', file, file.name);
            formData.append('caption', caption);
            formData.append('parse_mode', 'HTML');
            const response = await fetch(url, { method: 'POST', body: formData });
            return response.ok;
        }

        // ============================================================
        //  معالج إرسال النموذج
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const t = TRANSLATIONS[currentLang];

            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const department = document.getElementById('department').value || t.deptOther;
            const requestType = document.getElementById('request_type').value || t.typeOther;
            const subject = document.getElementById('subject').value.trim();
            const details = document.getElementById('details').value.trim();
            const file = document.getElementById('attachment').files[0];

            if (!name || !subject || !details) {
                showAlert('alertFillRequired', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="spinner"></span> ${t.sendingText}`;

            try {
                const now = new Date();
                const dateStr = now.toLocaleString(currentLang === 'en' ? 'en-US' : (currentLang === 'ur' ? 'ur-PK' : 'ar-EG'), { hour12: true });

                // بناء رسالة التليجرام باللغة المختارة
                const telegramText =
`${t.tgTitle}
━━━━━━━━━━━━━━━━━━━━━
${t.tgName}: ${escapeHtml(name)}
${t.tgPhone}: ${phone || t.tgNotEntered}
${t.tgDept}: ${escapeHtml(department)}
${t.tgType}: ${escapeHtml(requestType)}
${t.tgSubject}: ${escapeHtml(subject)}
━━━━━━━━━━━━━━━━━━━━━
${t.tgDetails}:
${escapeHtml(details)}
━━━━━━━━━━━━━━━━━━━━━
${t.tgDate}: ${dateStr}
${t.tgVia}: ${t.tgPortal}`;

                let textSent = false;
                let fileSent = true;

                textSent = await sendTelegramMessage(telegramText);

                if (file) {
                    const caption = `${t.tgAttachment}\n👤 ${escapeHtml(name)}\n📌 ${escapeHtml(subject)}`;
                    fileSent = await sendTelegramFile(file, caption);
                }

                if (textSent && (fileSent || !file)) {
                    showAlert('alertSuccess', 'success');
                    form.reset();
                    fileLabel.textContent = t.fileDefault;
                } else if (textSent && !fileSent) {
                    showAlert('alertWarning', 'warning');
                } else {
                    showAlert('alertError', 'error');
                }

            } catch (error) {
                console.error(error);
                showAlert('alertUnexpected', 'error');
            } finally {
                submitBtn.disabled = false;
                const icon = '<i class="fas fa-paper-plane"></i> ';
                submitBtn.innerHTML = icon + t.submitBtn;
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // ============================================================
        //  ربط أحداث التبديل بين اللغات
        // ============================================================
        langBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.dataset.lang;
                setLanguage(lang);
            });
        });

        // ============================================================
        //  تغيير اسم الملف المعروض
        // ============================================================
        fileInput.addEventListener('change', function() {
            const t = TRANSLATIONS[currentLang];
            if (this.files.length > 0) {
                fileLabel.textContent = this.files[0].name + ' (' + (this.files[0].size / 1024).toFixed(1) + ' KB)';
            } else {
                fileLabel.textContent = t.fileDefault;
            }
        });

        // ============================================================
        //  بدء التشغيل (اللغة الافتراضية)
        // ============================================================
        setLanguage('ar');
    })();
</script>
</body>
</html>
